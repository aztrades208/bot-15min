  magic_number: 159045   # identificador único de la EA en la cuenta

broker:
  type: "mt5"
  login: 12345678
  password: "REPLACE_ME"
  server: "VantageInternational-Demo"
  terminal_path: null    # opcional: ruta al MT5 terminal64.exe
  deviation_points: 20   # slippage tolerado en points para órdenes market

propfirm:
  active_rules_file: "../propfirms/rules/vantage-prop.json"
  enforce_daily_loss: true
  enforce_overall_drawdown: true
  flat_before_close_minutes: null   # null = no flatten antes; o N minutos para flatten N min antes del cierre

state:
