  range_end: "09:45"
  entry_window_end: "17:00"
  timezone: "America/New_York"
  breakout_timeframe_minutes: 5
  body_breakout_only: true
  one_trade_per_day: true
  hold_until_resolution: true

  risk_usd: 2000
  tp_r_multiple: 0.5
